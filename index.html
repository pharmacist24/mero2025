 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Community Pharmacy Training - Antibacterials & Antifungals (Iraq Practice)</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-light: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #eab308;
      --border: #e2e8f0;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-card {
      background: var(--surface);
      width: 100%;
      max-width: 750px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-text h1 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .header-text p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .timer-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .timer-badge.warning {
      background: #fef08a;
      color: #854d0e;
    }

    .timer-badge.danger {
      background: #fecaca;
      color: #991b1b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .progress-bar {
      height: 6px;
      background: #e2e8f0;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .content {
      padding: 24px;
    }

    .question-meta {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #f0f9ff;
    }

    .option-btn.selected {
      background: #e0f2fe;
      border-color: var(--primary);
      font-weight: 600;
    }

    .footer {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: calc(var(--radius) - 4px);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .results {
      text-align: center;
      padding: 40px 24px;
    }

    .results h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .results p {
      color: var(--text-light);
      margin-bottom: 24px;
      font-size: 1.1rem;
    }

    .time-up-banner {
      color: var(--danger);
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <div class="header">
    <div class="header-text">
      <h1>Summer Training Guide Evaluation</h1>
      <p>30 Antibacterial & 10 Antifungal MCQs</p>
    </div>
    <div class="timer-badge" id="timer-display">
      ⏱️ <span id="timer">20:00</span>
    </div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div id="quiz-body" class="content">
    <div class="question-meta" id="question-number">Question 1 of 40</div>
    <div class="question-text" id="question-text">Loading...</div>
    <div class="options" id="options-container"></div>
  </div>

  <div class="footer" id="footer">
    <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
  </div>
</div>

<script>
  const questions = [
    // --- 30 ANTIBACTERIAL MCQS ---
    {
      question: "1. Amoxicillin is co-formulated with Clavulanic acid (Augmentin) to achieve which primary therapeutic objective at the community pharmacy level?",
      options: [
        "Inhibit bacterial beta-lactamase enzymes and protect amoxicillin from destruction",
        "Enhance renal excretion and delay hepatic clearance",
        "Block bacterial 50S ribosomal protein translation",
        "Prevent gastrointestinal upset and acid degradation in the stomach"
      ],
      answer: 0
    },
    {
      question: "2. Which extended-spectrum penicillin derivative is commonly combined with Tazobactam for severe nosocomial and pseudomonal infections?",
      options: ["Ampicillin", "Piperacillin", "Oxacillin", "Penicillin V"],
      answer: 1
    },
    {
      question: "3. A patient comes to your pharmacy with a prescription for Piocefix 400 mg (Cefixime by Pioneer Co.). What advice should you provide regarding common gastrointestinal side effects?",
      options: [
        "It may cause mild diarrhea or stomach upset; take it with food if stomach upset occurs",
        "It causes severe immediate hair loss after 3 days of use",
        "It must be taken with a glass of milk to prevent bone damage",
        "It causes severe sleepiness and cannot be taken during the daytime"
      ],
      answer: 0
    },
    {
      question: "4. A mother visits the pharmacy to pick up Piolexine oral suspension (Cephalexin by Pioneer Co.) for her child. What important counseling tip should you give her about storing the reconstituted bottle?",
      options: [
        "Keep it at room temperature in direct sunlight for up to 30 days",
        "Keep it refrigerated (2°C–8°C) and discard any remaining portion after 14 days",
        "Freeze the bottle solid between every dose",
        "Mix the suspension with boiling tea right before administration"
      ],
      answer: 1
    },
    {
      question: "5. Why is Ceftriaxone strictly avoided in neonates under 28 days of age?",
      options: [
        "Risk of acute tubular necrosis and ototoxicity",
        "Biliary sludging, hyperbilirubinemia, and fatal calcium-ceftriaxone precipitation",
        "High risk of gray baby syndrome",
        "Immediate systemic tendon rupture"
      ],
      answer: 1
    },
    {
      question: "6. Which 4th-generation cephalosporin possesses balanced activity against both Gram-positive organisms and Pseudomonas aeruginosa?",
      options: ["Cefuroxime", "Cefepime", "Cefdinir", "Ceftaroline"],
      answer: 1
    },
    {
      question: "7. When dispensing Zinax 500 mg tablets (Cefuroxime axetil by Pioneer Co.), how should you advise the patient to take the medication to ensure optimal absorption?",
      options: [
        "Take immediately after a meal, as food enhances oral absorption",
        "Take on an empty stomach at least 2 hours before meals",
        "Crush the tablet and dissolve it in lemon juice",
        "Take strictly at bedtime with an antacid tablet"
      ],
      answer: 0
    },
    {
      question: "8. Imipenem is formulated in combination with Cilastatin to prevent which physiological process?",
      options: [
        "Metabolism by renal dehydropeptidase-I in the proximal tubules",
        "Hepatic glucuronidation and excretion",
        "Precipitation in cardiac tissue",
        "Degradation by stomach gastric acid"
      ],
      answer: 0
    },
    {
      question: "9. A patient is prescribed Cipro-Pioneer 500 mg (Ciprofloxacin by Pioneer Co.) for a UTI. What advice should you give regarding mineral supplements like iron or calcium?",
      options: [
        "Take them together at the exact same time to boost absorption",
        "Separate taking Cipro-Pioneer from mineral supplements by at least 2 hours before or 6 hours after",
        "Dissolve the tablet in milk to protect the stomach",
        "Chew the tablet together with multivitamin tablets"
      ],
      answer: 1
    },
    {
      question: "10. Rapid intravenous administration of Vancomycin can trigger 'Red Man Syndrome'. How should the pharmacist advise managing this reaction?",
      options: [
        "Discontinue the drug permanently due to IgE anaphylaxis",
        "Slow down the IV infusion rate and pre-treat with antihistamines",
        "Switch immediately to high-dose oral vancomycin",
        "Administer epinephrine and IV corticosteroids immediately"
      ],
      answer: 1
    },
    {
      question: "11. Why is oral Vancomycin prescribed in community/hospital settings, given that it is not systemically absorbed?",
      options: [
        "To treat systemic bacteremia locally",
        "To eradicate localized Clostridioides difficile colitis in the gut lumen",
        "To bypass hepatic first-pass clearance",
        "To protect the kidneys from systemic exposure"
      ],
      answer: 1
    },
    {
      question: "12. Daptomycin should NEVER be chosen to treat pulmonary infections or pneumonia because of which reason?",
      options: [
        "It cannot penetrate alveolar tissue",
        "It is inactivated by pulmonary surfactant",
        "It causes immediate acute bronchospasm",
        "It lacks activity against Gram-positive cocci"
      ],
      answer: 1
    },
    {
      question: "13. Gentamicin belongs to which antibiotic class that acts by binding to the 30S ribosomal subunit to cause mRNA misreading?",
      options: ["Macrolides", "Aminoglycosides", "Tetracyclines", "Lincosamides"],
      answer: 1
    },
    {
      question: "14. A patient receiving prolonged Gentamicin therapy should be routinely evaluated for signs of which toxicities?",
      options: [
        "Hepatic steatosis and pulmonary edema",
        "Nephrotoxicity and Ototoxicity (vestibular/auditory damage)",
        "Tendonitis and hypoglycemia",
        "Optic neuritis and blood dyscrasias"
      ],
      answer: 1
    },
    {
      question: "15. Why are Tetracyclines contraindicated in pregnant women and children under 8 years of age?",
      options: [
        "Risk of premature epiphyseal closure and bone fractures",
        "Calcium chelation causing permanent tooth discoloration and enamel hypoplasia",
        "High risk of fatal hepatic necrosis",
        "Development of severe aplastic anemia"
      ],
      answer: 1
    },
    {
      question: "16. Which tetracycline derivative does NOT require dosage adjustment in patients with renal impairment due to primary elimination via feces/bile?",
      options: ["Tetracycline", "Doxycycline", "Oxytetracycline", "Demeclocycline"],
      answer: 1
    },
    {
      question: "17. A patient picking up Doxycycline capsules should receive which practical counseling instruction?",
      options: [
        "Take right before bedtime with a small sip of water",
        "Take with a full glass of water and remain upright for 30 minutes to prevent esophagitis",
        "Crush the capsule and mix with milk or yogurt",
        "Take simultaneously with calcium or iron supplements for optimal uptake"
      ],
      answer: 1
    },
    {
      question: "18. A customer asks how to take Azithrocin 500 mg tablets (Azithromycin by Awamedica) prescribed for a 3-day course. What is the standard daily dosing advice?",
      options: [
        "Take 1 tablet every 4 hours continuously for 10 days",
        "Take 1 tablet once daily at the same time each day for 3 consecutive days",
        "Take 2 tablets every 6 hours only when feeling feverish",
        "Dissolve 3 tablets in warm water and drink all at once"
      ],
      answer: 1
    },
    {
      question: "19. Macrolide antibiotics (e.g., Erythromycin, Clarithromycin) carry a clinical warning regarding which cardiovascular adverse effect?",
      options: ["Sinus bradycardia", "QT interval prolongation and risk of Torsades de Pointes", "Hypertensive crisis", "Heart block"],
      answer: 1
    },
    {
      question: "20. Why do Erythromycin and Clarithromycin interact with many chronic medications (like simvastatin and warfarin)?",
      options: [
        "They induce intestinal P-glycoprotein efflux pumps",
        "They act as potent inhibitors of hepatic CYP3A4 enzymes",
        "They cause systemic renal tubular dysfunction",
        "They displace drugs from serum albumin binding sites"
      ],
      answer: 1
    },
    {
      question: "21. Clindamycin therapy carries a well-known black box warning for predisposing patients to which gastrointestinal complication?",
      options: [
        "Severe peptic ulcer disease",
        "Clostridioides difficile pseudomembranous colitis",
        "Acute ischemic bowel disease",
        "Esophageal stricture"
      ],
      answer: 1
    },
    {
      question: "22. A patient taking Klacimed 500 mg (Clarithromycin by Awamedica) reports an unusual side effect in their mouth. Which common, harmless side effect is most likely occurring?",
      options: [
        "A metallic or bitter taste alteration (dysgeusia)",
        "Bright blue discoloration of the tongue",
        "Sudden loosening of the teeth",
        "Numbness of the lower lip lasting for weeks"
      ],
      answer: 0
    },
    {
      question: "23. What is the most frequent gastrointestinal side effect patients experience when taking Augmentin or Amoxiclav (Amoxicillin + Clavulanate)?",
      options: [
        "Diarrhea and abdominal cramping",
        "Severe constipation lasting several days",
        "Bright blue colored stools",
        "Immediate total loss of appetite for a month"
      ],
      answer: 0
    },
    {
      question: "24. Ciprofloxacin exhibits its strongest antibacterial activity against which group of organisms?",
      options: [
        "Gram-positive cocci and anaerobes",
        "Aerobic Gram-negative bacilli, including Pseudomonas aeruginosa",
        "Atypical mycobacteria only",
        "Oral spirochetes"
      ],
      answer: 1
    },
    {
      question: "25. A patient taking Ciprofloxacin presents with pain and swelling over the back of the heel. What FDA black box warning applies?",
      options: [
        "Acute rhabdomyolysis",
        "Tendonitis and risk of tendon rupture (especially Achilles tendon)",
        "Pathologic bone fracture",
        "Osteonecrosis"
      ],
      answer: 1
    },
    {
      question: "26. Co-trimoxazole represents a synergistic combination of Sulfamethoxazole and Trimethoprim. How do these two drugs interact?",
      options: [
        "They disrupt cell wall peptidoglycan cross-linking at different steps",
        "They produce sequential blockade of bacterial folic acid synthesis",
        "They enhance each other's biliary excretion rate",
        "They prevent ribosomal translocation on the 50S subunit"
      ],
      answer: 1
    },
    {
      question: "27. Trimethoprim-Sulfamethoxazole can precipitate acute intravascular hemolysis in patients with which inherited deficiency?",
      options: [
        "G6PD (Glucose-6-Phosphate Dehydrogenase) deficiency",
        "Factor VIII deficiency",
        "Vitamin K deficiency",
        "Glucuronosyltransferase deficiency"
      ],
      answer: 0
    },
    {
      question: "28. When dispensing Metronidazole for a patient, what essential lifestyle modification must be communicated?",
      options: [
        "Avoid high-fat meals during therapy",
        "Avoid alcohol completely during treatment and for at least 48 hours after due to a disulfiram-like reaction",
        "Avoid intake of direct sunlight and UV radiation",
        "Take on an empty stomach with acidic fruit juice"
      ],
      answer: 1
    },
    {
      question: "29. A patient taking Nitrofurantoin (e.g., Urofurantin) for a UTI returns to the community pharmacy worried about their urine color. What reassuring advice should the pharmacist provide?",
      options: [
        "Discontinue immediately; dark urine indicates sudden liver failure",
        "Reassure them that brown or dark yellow urine is a harmless effect of this medication",
        "Tell them to drink lemon juice to turn the urine clear",
        "Advise them that purple urine indicates kidney damage"
      ],
      answer: 1
    },
    {
      question: "30. When dispensing Metronil (Metronidazole by SDI) tablets, what practical advice should be given if the patient experiences stomach distress?",
      options: [
        "Take the tablet with or immediately after meals to minimize GI upset",
        "Take strictly on an empty stomach with vinegar",
        "Chew the tablet dry without liquids",
        "Dissolve the tablet in hot coffee"
      ],
      answer: 0
    },

    // --- 10 ANTIFUNGAL MCQS ---
    {
      question: "31. What is the cellular mechanism of action of Fluconazole and other azole antifungals?",
      options: [
        "Inhibition of 1,3-beta-D-glucan synthase enzyme",
        "Inhibition of fungal CYP450 (14-alpha-demethylase), blocking ergosterol synthesis",
        "Direct binding to ergosterol creating membrane pores",
        "Inhibition of squalene epoxidase in cell walls"
      ],
      answer: 1
    },
    {
      question: "32. A patient prescribed oral Ketoconazole or Itraconazole capsules should be advised to take their dose with which type of beverage for adequate absorption?",
      options: [
        "Milk or calcium-fortified juice",
        "An acidic beverage like cola or orange juice",
        "Sodium bicarbonate solution",
        "Warm green tea"
      ],
      answer: 1
    },
    {
      question: "33. A female patient asks how to take a single dose of Fluzole 150 mg (Fluconazole by Pioneer Co.) prescribed for vaginal thrush. What is the correct counseling advice?",
      options: [
        "Take one capsule daily by mouth for 30 consecutive days",
        "Take the single 150 mg capsule orally with water, with or without food",
        "Insert the capsule topically as a vaginal suppository",
        "Dissolve the capsule powder in hot water and apply to the skin"
      ],
      answer: 1
    },
    {
      question: "34. Amphotericin B exerts its potent fungicidal action by which cellular mechanism?",
      options: [
        "Binding directly to ergosterol in the fungal membrane to form transmembrane pores",
        "Blocking DNA and RNA synthesis via conversion to 5-fluorouracil",
        "Inhibiting fungal cell wall glucan production",
        "Blocking microtubule assembly during mitosis"
      ],
      answer: 0
    },
    {
      question: "35. Why are liposomal/lipid formulations of Amphotericin B preferred over conventional Amphotericin B deoxycholate in clinical practice?",
      options: [
        "They possess a broader antifungal spectrum against viruses",
        "They significantly reduce nephrotoxicity and infusion-related reactions",
        "They eliminate the need for intravenous administration",
        "They do not bind fungal membranes"
      ],
      answer: 1
    },
    {
      question: "36. A mother buys Daktarin Oral Gel (Miconazole) for her infant's oral thrush. What key counseling point must the pharmacist highlight to prevent choking?",
      options: [
        "Apply a large blob of gel directly to the back of the baby's throat all at once",
        "Apply small amounts of gel to the front of the mouth using a clean finger, avoiding the back of the throat",
        "Mix the entire tube of gel into the infant's milk bottle",
        "Instruct the infant to gargle the gel for two minutes and spit out"
      ],
      answer: 1
    },
    {
      question: "37. Echinocandins (e.g., Caspofungin, Micafungin) act against fungal cell structures via which unique mechanism?",
      options: [
        "Inhibition of ergosterol cell membrane synthesis",
        "Inhibition of (1,3)-beta-D-glucan synthase, weakening the fungal cell wall",
        "Binding fungal tubulin subunits",
        "Inhibition of fungal squalene epoxidase"
      ],
      answer: 1
    },
    {
      question: "38. A patient is prescribed Terbasil 250 mg tablets (Terbinafine by Awamedica) for a fungal nail infection. What potential side effect regarding taste should they be advised about?",
      options: [
        "Temporary loss or alteration of taste (ageusia/dysgeusia)",
        "Permanent dark blue staining of the teeth",
        "An intense sweet taste in all consumed foods",
        "Permanent loss of hearing"
      ],
      answer: 0
    },
    {
      question: "39. Patients started on long-term oral Terbinafine for toenail infections should undergo baseline and periodic laboratory monitoring of which function?",
      options: [
        "Serum creatinine and BUN",
        "Hepatic transaminases (LFTs)",
        "Pulmonary function tests",
        "Thyroid stimulating hormone (TSH)"
      ],
      answer: 1
    },
    {
      question: "40. Oral Griseofulvin is classically taken with a high-fat meal (e.g., milk, butter, ice cream) to address which pharmacokinetic property?",
      options: [
        "To prevent severe gastric acidity",
        "To enhance GI dissolution and systemic lipophilic absorption",
        "To prevent rapid renal clearance",
        "To block hepatic metabolism"
      ],
      answer: 1
    }
  ];

  let currentQuestionIndex = 0;
  let userAnswers = new Array(questions.length).fill(null);
  
  // 20 Minutes Timer Variable (in seconds)
  let totalTime = 20 * 60;
  let timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(() => {
      totalTime--;

      const minutes = Math.floor(totalTime / 60);
      const seconds = totalTime % 60;

      const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      document.getElementById("timer").innerText = formattedTime;

      const badge = document.getElementById("timer-display");
      if (totalTime <= 300 && totalTime > 60) {
        badge.classList.add("warning");
      } else if (totalTime <= 60) {
        badge.classList.remove("warning");
        badge.classList.add("danger");
      }

      // Time Up: Freeze and Show Score
      if (totalTime <= 0) {
        clearInterval(timerInterval);
        showResults(true);
      }
    }, 1000);
  }

  function loadQuestion() {
    const q = questions[currentQuestionIndex];
    
    // Update progress bar & question meta
    const progressPercent = (currentQuestionIndex / questions.length) * 100;
    document.getElementById("progress").style.width = progressPercent + "%";
    document.getElementById("question-number").innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    document.getElementById("question-text").innerHTML = q.question;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    
    const selectedIndex = userAnswers[currentQuestionIndex];
    const nextBtn = document.getElementById("next-btn");
    
    // Disable Next button if no option selected for current question
    nextBtn.disabled = selectedIndex === null;

    if (currentQuestionIndex === questions.length - 1) {
      nextBtn.innerText = "Finish Exam";
    } else {
      nextBtn.innerText = "Next Question";
    }

    // Render options
    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn" + (selectedIndex === idx ? " selected" : "");
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      container.appendChild(btn);
    });
  }

  function selectOption(index) {
    userAnswers[currentQuestionIndex] = index;
    
    const container = document.getElementById("options-container");
    const buttons = container.getElementsByClassName("option-btn");

    for (let i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove("selected");
    }
    buttons[index].classList.add("selected");

    // Enable next button once an option is selected
    document.getElementById("next-btn").disabled = false;
  }

  function nextQuestion() {
    if (currentQuestionIndex < questions.length - 1) {
      currentQuestionIndex++;
      loadQuestion();
    } else {
      clearInterval(timerInterval);
      showResults(false);
    }
  }

  function showResults(isTimeUp = false) {
    document.getElementById("progress").style.width = "100%";
    
    // Calculate final score
    let score = 0;
    userAnswers.forEach((ans, idx) => {
      if (ans === questions[idx].answer) {
        score++;
      }
    });

    const percentage = Math.round((score / questions.length) * 100);
    
    const quizBody = document.getElementById("quiz-body");
    quizBody.innerHTML = `
      <div class="results">
        ${isTimeUp ? '<p class="time-up-banner">⏰ Time limit of 20 minutes reached! The exam has ended.</p>' : ''}
        <h2>Exam Completed!</h2>
        <p>Your Final Score: <strong>${score} / ${questions.length}</strong> (${percentage}%)</p>
        <button class="btn" onclick="restartQuiz()">Retake Exam</button>
      </div>
    `;
    
    document.getElementById("footer").style.display = "none";
  }

  function restartQuiz() {
    clearInterval(timerInterval);
    totalTime = 20 * 60;
    currentQuestionIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    
    const badge = document.getElementById("timer-display");
    badge.classList.remove("warning", "danger");
    document.getElementById("timer").innerText = "20:00";
    
    document.getElementById("footer").style.display = "flex";
    
    const quizBody = document.getElementById("quiz-body");
    quizBody.innerHTML = `
      <div class="question-meta" id="question-number">Question 1 of 40</div>
      <div class="question-text" id="question-text">Loading...</div>
      <div class="options" id="options-container"></div>
    `;
    
    loadQuestion();
    startTimer();
  }

  // Initialize exam and start timer on page load
  loadQuestion();
  startTimer();
</script>
</body>
</html>
