      width: 100%;
    }

      background: var(--primary);
      width: 0%;

    }

    .content {
      padding: 24px;
    }

      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0f9ff;
    }

    .option-btn.correct {
      background: #dcfce7;
      border-color: var(--success);
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background: #fee2e2;
      border-color: var(--danger);
      color: #7f1d1d;
    }

    .explanation {
      margin-top: 20px;
      padding: 16px;
      border-radius: calc(var(--radius) - 2px);
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }

    .footer {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: flex-end;
    }

      background: var(--primary);

      padding: 10px 20px;
      border-radius: calc(var(--radius) - 4px);
      font-size: 0.95rem;
      font-weight: 600;

    .btn:disabled {

    }

    .results {

</head>

    // Update progress bar & labels
    const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
    document.getElementById("progress").style.width = progressPercent + "%";
    document.getElementById("question-number").innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    document.getElementById("question-text").innerHTML = q.question;
    
    // Clear state
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    const explanationDiv = document.getElementById("explanation");
    explanationDiv.style.display = "none";
    explanationDiv.innerHTML = "";
    
    const nextBtn = document.getElementById("next-btn");
    nextBtn.disabled = true;
    if (currentQuestionIndex === questions.length - 1) {
      nextBtn.innerText = "Finish Quiz";
    } else {
      nextBtn.innerText = "Next Question";
    }

    selectedOption = null;

    // Render options
    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      container.appendChild(btn);
    });
  }

  function selectOption(index) {
    if (selectedOption !== null) return; // Prevent changing choice after selection
    
    selectedOption = index;
    const q = questions[currentQuestionIndex];
    const container = document.getElementById("options-container");
    const buttons = container.getElementsByClassName("option-btn");

    if (index === q.answer) {
      score++;
      buttons[index].classList.add("correct");
    } else {
      buttons[index].classList.add("incorrect");
      buttons[q.answer].classList.add("correct");
    }

    // Disable all options after selection
    for (let btn of buttons) {
      btn.disabled = true;
    }

    // Show clinical pearl explanation
    const explanationDiv = document.getElementById("explanation");
    explanationDiv.innerHTML = q.explanation;
    explanationDiv.style.display = "block";

    // Enable next button
    document.getElementById("next-btn").disabled = false;
  }

  function nextQuestion() {
    if (currentQuestionIndex < questions.length - 1) {
      currentQuestionIndex++;
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById("progress").style.width = "100%";
    const percentage = Math.round((score / questions.length) * 100);
    
    const quizBody = document.getElementById("quiz-body");
    quizBody.innerHTML = `
      <div class="results">
        <h2>Quiz Completed!</h2>
        <p>Your Final Score: <strong>${score} / ${questions.length}</strong> (${percentage}%)</p>
        <button class="btn" onclick="restartQuiz()">Try Again</button>
      </div>
    `;
    
    document.getElementById("footer").style.display = "none";
  }

  function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById("footer").style.display = "flex";
    
    // Restore initial DOM structure
    const quizBody = document.getElementById("quiz-body");
    quizBody.innerHTML = `
      <div class="question-meta" id="question-number">Question 1 of 40</div>
      <div class="question-text" id="question-text">Loading...</div>
      <div class="options" id="options-container"></div>
      <div class="explanation" id="explanation"></div>
    `;
    
    loadQuestion();
  }

  // Initialize quiz on start
  loadQuestion();
</script>
</body>
</html>
